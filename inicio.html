<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelvin Leardini - Início</title>

    <style>
        body {
            background-image: url('bgimg.png');
            background-size: cover; /* Estica a imagem para preencher toda a tela sem distorcer */
            background-position: center; /* Mantém o centro da imagem visível */
            min-height: 100vh; /* Garante que o fundo ocupe no mínimo 100% da altura da janela */
            background-repeat: no-repeat; /* Impede que a imagem fique se repetindo */
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
        }

/* No topo: joga a logo para a esquerda e os botões para a direita */
        header {
            display: flex;
            justify-content: space-between; /* Cria o espaço máximo entre os elementos */
            align-items: center; /* Alinha verticalmente no centro */
            margin-bottom: 20px;
        }

        .btn {
            background-color: rgb(129, 193, 253);
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
        }

        .btn a {
            color: #000;
            text-decoration: none;
        }

        /* Container que coloca o Main e o Aside lado a lado */
        .conteudo-principal {
            display: flex;
            gap: 20px; /* Distância de 20px entre o Main e o Aside */
            align-items: flex-start;
            margin-bottom: 20px;
        }

        main {
            flex: 3; /* O Main ocupa 3 partes do espaço (coluna maior) */
        }

        aside {
            flex: 1; /* O Aside ocupa 1 parte do espaço (coluna menor) */
        }

        footer {
            width: 100%;
        }
    </style>
</head>

<body>

    <!-- Header no topo, totalmente LIVRE de divs -->
    <header>
        <a href="inicio.html"><img src="imglogo.png" alt="Logo" style="width: 100px;"></a>
        
        <nav>
            <button class="btn"><a href="inicio.html">Início</a></button>
            <button class="btn"><a href="sobre.html">Sobre</a></button>
            <button class="btn"><a href="redes.html">Contato</a></button>
            <button class="btn"><a href="portifolio.html">Portfólio</a></button>
        </nav>
    </header>

    <!-- Corpo do Início: APENAS Main e Aside aqui dentro -->
    <div class="conteudo-principal">
        <main>
            <section id="apresentacao-inicial">
                <h2>Apresentação</h2>
                <article>
                    <h3>Bem-vindo à minha página</h3>
                    <p>Aqui você vai encontrar informações sobre mim e meu trabalho, incluindo projetos feitos e meu portfólio profissional.</p>
                </article>
            </section>
        </main>

        <aside>
            <!-- Espaço reservado para novidades, fotos curtas ou avisos -->
        </aside>
    </div>

    <!-- Rodapé -->
    <footer>
        <p>&copy; 2026 Kelvin Leardini - Todos os direitos reservados.</p>
    </footer>

</body>
</html>
